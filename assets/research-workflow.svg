<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Research workflow</title>
  <desc id="desc">Four color-coded steps: define the boundary, validate in isolation, report privately, coordinate publication.</desc>
  <rect width="1200" height="270" rx="24" fill="#0B1B36"/>
  <path d="M291 135h30M585 135h30M879 135h30" stroke="#A2B5D5" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 6"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(20 25)"><rect width="270" height="220" rx="18" fill="#142B50" stroke="#5175AE"/><path d="M18 0h234" stroke="#8292FF" stroke-width="6"/><circle cx="38" cy="46" r="20" fill="#8292FF"/><text x="26" y="53" font-size="18" font-weight="700" fill="#111B37">01</text><text x="19" y="105" font-size="23" font-weight="700" fill="#F7FAFF">Define the boundary</text><text x="19" y="142" font-size="16" fill="#C6D7EC">Expected and observed</text><path d="M19 171h80" stroke="#8292FF" stroke-width="3"/></g>
    <g transform="translate(314 25)"><rect width="270" height="220" rx="18" fill="#142B50" stroke="#3C8F9F"/><path d="M18 0h234" stroke="#32D6C4" stroke-width="6"/><circle cx="38" cy="46" r="20" fill="#32D6C4"/><text x="26" y="53" font-size="18" font-weight="700" fill="#111B37">02</text><text x="19" y="105" font-size="23" font-weight="700" fill="#F7FAFF">Validate safely</text><text x="19" y="142" font-size="16" fill="#C6D7EC">Controlled evidence</text><path d="M19 171h80" stroke="#32D6C4" stroke-width="3"/></g>
    <g transform="translate(608 25)"><rect width="270" height="220" rx="18" fill="#142B50" stroke="#A47B8B"/><path d="M18 0h234" stroke="#F199B1" stroke-width="6"/><circle cx="38" cy="46" r="20" fill="#F199B1"/><text x="26" y="53" font-size="18" font-weight="700" fill="#111B37">03</text><text x="19" y="105" font-size="23" font-weight="700" fill="#F7FAFF">Report privately</text><text x="19" y="142" font-size="16" fill="#C6D7EC">Maintainer's channel</text><path d="M19 171h80" stroke="#F199B1" stroke-width="3"/></g>
    <g transform="translate(902 25)"><rect width="278" height="220" rx="18" fill="#142B50" stroke="#B28B5F"/><path d="M18 0h242" stroke="#FFBD69" stroke-width="6"/><circle cx="38" cy="46" r="20" fill="#FFBD69"/><text x="26" y="53" font-size="18" font-weight="700" fill="#111B37">04</text><text x="19" y="105" font-size="23" font-weight="700" fill="#F7FAFF">Coordinate release</text><text x="19" y="142" font-size="16" fill="#C6D7EC">Fix, credit, publication</text><path d="M19 171h80" stroke="#FFBD69" stroke-width="3"/></g>
  </g>
</svg>
