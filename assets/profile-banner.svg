  <circle cx="75" cy="55" r="5" fill="#32D6C4"/><text x="91" y="61" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#D7FFFA">MUTED CYBERSECURITY</text>
  <text x="54" y="151" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" fill="#F7FAFF">Security research</text>
  <text x="54" y="207" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#B9C7FF">with clear outcomes.</text>
  <text x="57" y="252" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#D9E4F4">Evidence-led testing. Private reporting. Coordinated release.</text>
