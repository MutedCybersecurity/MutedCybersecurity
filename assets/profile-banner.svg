<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muted Cybersecurity — security research</title>
  <desc id="desc">Corporate navy and blue banner with teal, violet and amber accents, a shield illustration, and security research message.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1731"/><stop offset=".52" stop-color="#143367"/><stop offset="1" stop-color="#342C72"/></linearGradient>
    <linearGradient id="glow"><stop stop-color="#32D6C4"/><stop offset="1" stop-color="#8292FF"/></linearGradient>
    <linearGradient id="tile" x2="1" y2="1"><stop stop-color="#355584"/><stop offset="1" stop-color="#24315F"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#102B54"/>
  <circle cx="1100" cy="-30" r="250" fill="#8292FF" opacity=".13"/><circle cx="990" cy="368" r="265" fill="#32D6C4" opacity=".10"/>
  <path d="M740 0v360M805 0v360M870 0v360M935 0v360M1000 0v360M1065 0v360M1130 0v360M740 77h460M740 142h460M740 207h460M740 272h460" stroke="#B7DAEF" stroke-opacity=".08"/>
